services:
  # ============================================================================
  # 1. MongoDB Community Database
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: 5g-traffic-mongodb
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      MONGO_INITDB_DATABASE: smart_campus_traffic
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"
    networks:
      - smart-campus-5g-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Node.js + ONNX YOLOv8 + RTSP Video Processing Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 5g-traffic-backend
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/smart_campus_traffic
      MONGODB_URI: mongodb://mongodb:27017/smart_campus_traffic
      CORS_ORIGIN: "*"
      MODEL_PATH: /app/models/yolov8n.onnx
      SEED_DATA_DIR: /app/data/seed
      PYTHON_PATH: /usr/bin/python3
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - smart-campus-5g-net
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    # ==========================================================================
    # Optional Hardware Passthrough: External USB Camera /dev/video0
    # Uncomment the following block if connecting a physical USB CCTV directly
    # to the Linux Edge Server host instead of 5G RTSP / IP streaming:
    # ==========================================================================
    # devices:
    #   - /dev/video0:/dev/video0

  # ============================================================================
  # 3. React 19 Frontend + Unprivileged Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 5g-traffic-frontend
    restart: unless-stopped
    ports:
      - "8080:8080" # Unprivileged HTTP
      - "8443:8443" # Unprivileged HTTPS (Self-signed SSL for remote 5G webcam getUserMedia)
    networks:
      - smart-campus-5g-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Isolated 5G Smart Campus Bridge Network
# ==============================================================================
networks:
  smart-campus-5g-net:
    driver: bridge
